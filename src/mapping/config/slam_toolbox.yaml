slam_toolbox:
  ros__parameters:
    # ==========================================
    # CẤU HÌNH CƠ BẢN (CORE)
    # ==========================================
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping # Chế độ vẽ bản đồ (sẽ chuyển thành localization khi chạy Nav2)
    debug_logging: false
    throttle_scans: 1 # Xử lý từng scan một (do Lidar quét ~10Hz là khá nhẹ định)

    # ==========================================
    # ĐỒNG BỘ THỜI GIAN & TF
    # ==========================================
    # Phát TF map -> odom ở 20Hz (0.05s). Nhanh hơn sẽ mượt RViz, nhưng tốn CPU.
    transform_publish_period: 0.05 
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # ==========================================
    # CẬP NHẬT BẢN ĐỒ (MAPPING)
    # ==========================================
    map_update_interval: 1.0 # Cập nhật hiển thị map trên RViz mỗi 1 giây
    resolution: 0.05         # Độ phân giải 5cm/pixel (Chuẩn cho Nav2)
    max_laser_range: 10.0    # Tầm nhìn tối đa của Lidar A2M8. Đặt 10m để an toàn.

    # ==========================================
    # SCAN MATCHING (QUYẾT ĐỊNH ĐỘ MƯỢT)
    # ==========================================
    use_scan_matching: true
    use_scan_barycenter: true
    
    # Chỉ xử lý Lidar khi xe đã di chuyển ít nhất 20cm hoặc xoay 10 độ.
    # ĐIỀU NÀY GIÚP XE KHÔNG BỊ GIẬT KHI ĐỨNG YÊN.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.174 
    minimum_time_interval: 0.5 

    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ==========================================
    # LOOP CLOSURE (CHỐNG TRÔI BẢN ĐỒ)
    # ==========================================
    do_loop_closing: true # BẮT BUỘC BẬT khi vẽ map để sửa lỗi góc xoay tích lũy
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_maximum_distance: 3.0

    # ==========================================
    # TỐI ƯU HÓA (PENALTY TIES)
    # ==========================================
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
