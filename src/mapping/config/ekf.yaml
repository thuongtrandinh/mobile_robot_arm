ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    predict_to_current_time: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # --- 1. ENCODER (Lấy vận tốc tiến X và vận tốc xoay Z) ---
    odom0: /diff_cont/odom
    odom0_config: [false, false, false, # X, Y, Z
                   false, false, false, # roll, pitch, yaw
                   true,  false, false, # vx, vy, vz (Lấy tiến/lùi)
                   false, false, true,  # v_roll, v_pitch, v_yaw (Bật true cho v_yaw)
                   false, false, false] # ax, ay, az
    odom0_differential: false              
    odom0_queue_size: 20

    # --- 2. IMU (Lấy góc Yaw và Vận tốc góc Z) ---
    imu0: /camera/imu
    imu0_config: [false, false, false,
                  false, false, true,  # Yaw (Lấy để giữ hướng)
                  false, false, false,
                  false, false, true,  # Vận tốc góc Z (Quan trọng nhất để chống xoay ảo)
                  false, false, false]
    imu0_differential: false
    imu0_relative: false  # Dùng góc Yaw TUYỆT ĐỐI để bám sát hướng thực tế
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: true # Bật để lọc nhiễu trọng trường

    # --- MA TRẬN NHIỄU HỆ THỐNG (Đã gỡ bỏ giới hạn ghìm xoay) ---
    # Yaw (0.03) và v_yaw (0.04) đã được trả về mức chuẩn để EKF phản hồi tức thời
