# D435i Hand Sign Detector Configuration (Optimized for VGA 640x480)

# ===== YOLO DETECTION PARAMETERS =====
yolo:
  # Person detection (LOWERED for grayscale robustness - critical fix for 100+ FPS systems)
  person_conf_thresh: 0.65       
  
  # Hand gesture detection
  handsign_conf_thresh: 0.45     # CỰC KỲ QUAN TRỌNG: Hạ xuống 0.45 để không miss tay nhỏ ở độ phân giải VGA
  
  # Non-Maximum Suppression
  iou_thresh: 0.50               # IOU threshold for NMS

# ===== TRACKING PARAMETERS =====
tracking:
  # Gesture recognition timing (reduced due to buffer filtering)
  gesture_hold_time: 1.0          # Reduced from 1.2 (voting buffer compensates)
  tracking_timeout: 10.0          # Max time (s) person can be lost before re-tracking
  
  # [THÊM MỚI] ID Switch Detection threshold (3D distance in meters)
  # If target re-appears but moved > 1.5m from EKF prediction, reject as ID Switch (likely different person)
  id_switch_threshold_m: 1.5      # 1.5 meters = reasonable max jump distance for 10s occlusion
  
  # BoT-SORT tracking parameters
  track_thresh: 0.40              # CRITICAL: Lower threshold for patient tracking
  track_buffer: 150               # Keep track ID for 150 frames
  match_thresh: 0.8               # Strict location matching
  max_age_before_predict: 60      # Use EKF prediction for 60 frames if YOLO temporarily misses
  
  # Gesture buffer (VOTING MECHANISM - 9/15 consensus for rock-solid detection)
  gesture_buffer_size: 15         # Keep last 15 frames (~0.5s @ 30 FPS)
  gesture_confirmation_ratio: 0.60  # Need 9/15 frames agreement (60%) for confirmation
                                   # Eliminates single-frame noise, "detect then disappear" issue
  
  # ROI scanning optimization (EXPANDED FOR CONTINUOUS HAND DETECTION)
  roi_margin_x_ratio: 0.35        # Nới rộng ngang 35% cho ảnh WVGA
  roi_margin_y_top_ratio: 0.30    # Nới lên trên 30% để đảm bảo bắt trọn tay giơ cao START
  roi_body_height_ratio: 0.80     # Scan 80% of body height (more generous, less noise from legs)

# ===== DEPTH FILTERING (Hand-person spatial validation) =====
depth_filter:
  # Hand-person spatial relationship
  max_hand_person_depth_diff: 0.85  # Hand within 85cm of person (depth consistency check)
                                     # Increased from 0.6 to 0.85 for START gesture (extended arm far forward)
                                     # BoT-SORT Two-Stage Matching provides person validation

# ===== HISTOGRAM EQUALIZATION (Grayscale enhancement) =====
image_processing:
  enable_histogram_equalization: false  # Apply CLAHE to enhance grayscale contrast
  clahe_clip_limit: 2.0                # Contrast limiting (2.0-4.0 recommended)
  clahe_tile_size: 8                   # Tile size for local contrast enhancement

# ===== VELOCITY FILTERING =====
velocity_filter:
  alpha: 0.3                      # Smoothing factor (0.1-0.5 recommended)
  
# ===== PUBLISHING =====
publishing:
  publish_rate: 30                # Hz
  enable_visualization: false     # Show opencv window (requires display)
  enable_performance_metrics: true  # Log FPS and latency

# ===== D435i CAMERA INTRINSICS (VGA - 640x480) =====
camera:
  width: 640
  height: 480
  fx: 386.0
  fy: 386.0
  cx: 320.0
  cy: 240.0