controller_server:
  ros__parameters:
    # Chú ý đồng bộ use_sim_time với toàn hệ thống (True cho Gazebo, False cho phần cứng thật)
    use_sim_time: true 
    controller_frequency: 10.0
    cmd_vel_topic: "/diff_cont/cmd_vel_unstamped"
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
      
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.1
      batch_size: 2000
      
      # Giới hạn Động học & Vận tốc
      ax_min: -1.0
      ax_max: 1.0
      ay_max: 0.0
      ay_min: 0.0
      az_min: -1.0
      az_max: 1.0
      vx_min: -0.8
      vx_max: 0.8
      vy_min: 0.0   # Bắt buộc = 0 cho DDMR
      vy_max: 0.0
      vz_min: -1.0
      vz_max: 1.0

      # Thông số nội bộ của MPPI
      motion_model: "DiffDrive" # Khai báo rõ mô hình động học vi sai
      IterationCount: 1
      PruneBoundary: false
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      visualize: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # --- CÁC HÀM ĐÁNH GIÁ (CRITICS) BẮT BUỘC ---
      critics:
        - ConstraintCritic
        - ObstaclesCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PreferForwardCritic

      # Trọng số của các Critics (Tùy chỉnh để thay đổi hành vi lái)
      ConstraintCritic:
        cost_weight: 4.0
      ObstaclesCritic:
        repulsion_weight: 1.5
        cost_weight: 25.0
        collision_cost: 100000.0
      PathAlignCritic:
        cost_weight: 2.0  # Giảm mạnh để không bám chặt vào đường thẳng, cho phép lách vật cản
        max_heuristic_path_distance: 3.0
      GoalCritic:
        cost_weight: 45.0  # Tăng cực mạnh để MPPI bằng mọi giá tiến về local_goal
        threshold_to_consider: 2.0
      GoalAngleCritic:
        cost_weight: 15.0  # Ưu tiên quay mũi xe về hướng local_goal
        threshold_to_consider: 1.0
      PreferForwardCritic:
        cost_weight: 5.0
        threshold_to_consider: 0.5

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true
