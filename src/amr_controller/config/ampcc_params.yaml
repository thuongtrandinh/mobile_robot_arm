# ──────────────────────────────────────────────────────────────
#  H-AMPCC Controller Parameters
# ──────────────────────────────────────────────────────────────
ampcc_controller:
  ros__parameters:
    # ── MPCC (§3.2) ──────────────────
    mpcc:
      N:              20        # prediction horizon steps
      dt:             0.05      # sampling period  [s]  → 20 Hz

      # Cost weights
      q_c:            10.0      # contouring-error weight
      q_l:            5.0       # lag-error weight
      q_u_R:          0.1       # v_cmd input weight
      q_u_M:          0.1       # ω_cmd input weight
      q_v:            1.0       # velocity-tracking weight
      q_theta:        2.0       # path-progress incentive
      q_u_vtheta:     0.01      # v_θ regularisation

      # Reference & limits
      v_ref:          0.5       # cruise speed        [m/s]
      v_cmd_max:      2.0       # max |v_cmd|         [m/s]
      omega_cmd_max:  2.0       # max |ω_cmd|         [rad/s]
      v_theta_max:    2.5       # max virtual-progress vel
      v_theta_min:   -0.1       # min virtual-progress vel

    # ── RLS estimator (§3.1) ─────────
    rls:
      lambda:             0.98  # forgetting factor  ∈ (0,1]
      p_init:             1000.0
      alpha_v_init:       0.95  # nominal α_v  ≈ 1 − bΔt/m
      beta_v_init:        0.05  # nominal β_v  ≈ Δt/m
      alpha_omega_init:   0.95  # nominal α_ω
      beta_omega_init:    0.05  # nominal β_ω

    # ── iLQR solver ──────────────────
    solver:
      max_iters:          10
      max_line_search:    8
      cost_tol:           0.0001
      mu_init:            1.0

    # ── Navigation ───────────────────
    goal_tolerance:       0.15  # distance to declare goal reached [m]
