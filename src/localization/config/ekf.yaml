ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    # Định nghĩa các hệ trục tọa độ TF
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint # Đảm bảo khớp với URDF của bạn
    world_frame: odom # EKF chỉ phát TF từ odom -> base_footprint

    # Cho phép EKF phát TF từ odom -> base_footprint
    publish_tf: true

    # ----------------------------------------
    # NGUỒN 1: BÁNH XE (Encoder)
    # ----------------------------------------
    odom0: /diff_cont/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false, # CHỈ LẤY VẬN TỐC TỊNH TIẾN (vX)
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # ----------------------------------------
    # NGUỒN 2: IMU TỪ ZED2 (200Hz)
    # ----------------------------------------
    imu0: /zed2/zed_node/imu/data
    imu0_config: [false, false, false,
                  false, false, true,  # LẤY GÓC XOAY (Yaw)
                  false, false, false,
                  false, false, true,  # LẤY VẬN TỐC GÓC (vYaw)
                  true,  false, false] # Lấy gia tốc tịnh tiến (aX) hỗ trợ tiến lùi
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: true                # Bắt buộc True để khởi tạo góc Yaw ở 0 độ
    imu0_remove_gravitational_acceleration: true

    # --- Process Noise Covariance (tăng lên để giảm tin tưởng vào prediction khi đứng yên) ---
