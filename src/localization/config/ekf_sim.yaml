### localization/config/ekf_sim.yaml
ekf_filter_node:
  ros__parameters:
    use_sim_time: true # Rất quan trọng khi chạy Simulate
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Dữ liệu từ bánh xe (Gazebo plugin)
    odom0: /diff_cont/odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]

    # Dữ liệu IMU từ Intel RealSense D435i
    imu0: /camera/imu 
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true